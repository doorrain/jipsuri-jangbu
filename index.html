<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하이집수리 현장장부</title>
  <!-- 개인 업무용 앱: 검색엔진·AI 수집 프로그램에 수집하지 말라고 표시 -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex, noai, noimageai" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="현장장부" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <main id="view"></main>
  </div>
  <button class="fab" id="fab" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>등록</button>
  <nav class="tabbar" id="tabbar" hidden>
    <div class="in">
      <button data-tab="schedule"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>일정</span></button>
      <button data-tab="customers"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 5.2a3.3 3.3 0 0 1 0 6.6M18.2 14.8c1.7.8 2.9 2.6 3.3 5.2"/></svg><span>고객</span></button>
      <button data-tab="ledger"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16.5 15h1.5"/><path d="M6 6l9.5-2.6a1.5 1.5 0 0 1 1.9 1.1L18 6"/></svg><span>장부</span></button>
      <button data-tab="report"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span>보고서</span></button>
    </div>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
